name: betsefer

x-app: &app
  image: betsefer-app:dev
  build:
    context: .
    dockerfile: docker/dev/Dockerfile
  restart: unless-stopped
  volumes:
    - .:/var/www/html
  working_dir: /var/www/html
  networks:
    - internal

services:
  app:
    <<: *app
    expose:
      - "9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - .:/var/www/html:ro
      - ./docker/dev/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - internal
      - traefik_net
    depends_on:
      - app
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_net"
      - "traefik.http.routers.betsefer.rule=Host(`betsefer.local`)"
      - "traefik.http.routers.betsefer.entrypoints=websecure"
      - "traefik.http.routers.betsefer.tls=true"
      - "traefik.http.services.betsefer.loadbalancer.server.port=80"
      - "traefik.http.routers.betsefer-http.rule=Host(`betsefer.local`)"
      - "traefik.http.routers.betsefer-http.entrypoints=web"

  queue:
    <<: *app
    command: php artisan queue:work --tries=3 --timeout=90
    user: "33"
    depends_on:
      - app

  scheduler:
    <<: *app
    command: php artisan schedule:work
    user: "33"
    depends_on:
      - app

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: betsefer
      POSTGRES_USER: betsefer
      POSTGRES_PASSWORD: betsefer
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U betsefer -d betsefer"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"
    networks:
      - internal

  vite:
    image: node:22-alpine
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    command: sh -c "npm install && npm run build -- --watch"
    networks:
      - internal

volumes:
  pgdata:

networks:
  internal:
  traefik_net:
    external: true
